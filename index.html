<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mragasferon</title>
<meta name="description" content="Личная страница MrAgasferon. Здесь живут плагины для Lampa.">
<style>
  :root { --bg:#0b0d10; --tv:#1b1f24; --glow:#7CFFB2; --dim:#3a4a42; --txt:#d7ffe6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  body { display:flex; align-items:center; justify-content:center; padding:16px; }
  .tv { width:min(640px,100%); background:var(--tv); border-radius:28px; padding:22px 22px 14px;
    box-shadow: 0 30px 80px #000a, inset 0 2px 0 #ffffff12; }
  .screen { position:relative; aspect-ratio:4/3; border-radius:18px; overflow:hidden; background:#000;
    box-shadow: inset 0 0 60px #000, 0 0 0 4px #0006; }
  canvas { position:absolute; inset:0; width:100%; height:100%; opacity:.18; }
  .scan { position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, #0000 0 2px, #0005 2px 3px);
    animation: roll 8s linear infinite; }
  @keyframes roll { from { background-position:0 0 } to { background-position:0 300px } }
  .content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    padding:8%; text-shadow:0 0 6px var(--glow); }
  .ch { position:absolute; top:5%; right:6%; font-size:clamp(18px,4vw,28px); color:var(--glow); }
  h1 { margin:0 0 .4em; font-size:clamp(20px,5vw,34px); color:var(--glow); font-weight:700; }
  p { margin:.3em 0; font-size:clamp(13px,2.6vw,16px); line-height:1.5; }
  a { color:var(--glow); }
  .blink::after { content:"█"; animation: b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity:0 } }
  .panel { display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:12px; }
  .brand { color:var(--dim); font-size:12px; letter-spacing:.2em; }
  .btns { display:flex; gap:10px; }
  button { width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
    background:#2a3038; color:var(--txt); font:inherit; font-size:18px;
    box-shadow: inset 0 -3px 0 #0006, 0 2px 6px #0008; }
  button:active { transform:translateY(1px); box-shadow: inset 0 -1px 0 #0006; }
  .hint { color:var(--dim); font-size:12px; text-align:center; margin-top:10px; }
  .flash .content { animation: flick .25s; }
  @keyframes flick { 0%{opacity:0; transform:scaleY(.02)} 60%{opacity:1; transform:scaleY(1.04)} 100%{transform:none} }
</style>
</head>
<body>
<div class="tv">
  <div class="screen" id="screen">
    <canvas id="noise" width="160" height="120"></canvas>
    <div class="content" id="content"></div>
    <div class="ch" id="ch"></div>
    <div class="scan"></div>
  </div>
  <div class="panel">
    <span class="brand">MRAGASFERON · TV</span>
    <div class="btns">
      <button id="prev" aria-label="Предыдущий канал">◀</button>
      <button id="next" aria-label="Следующий канал">▶</button>
    </div>
  </div>
  <div class="hint">переключай каналы стрелками или кнопками</div>
</div>

<script>
  var channels = [
    '<h1>Lampa Sync</h1>' +
    '<p>Синхронизация закладок, таймкодов и настроек Lampa / ByLampa через Google Таблицу на твоём собственном Диске.</p>' +
    '<p>Без сервера. Без чужих рук в твоих данных.</p>' +
    '<p><a href="/lampa-gsync/">→ подробнее</a> · <a href="/lampa-gsync/privacy.html">политика конфиденциальности</a></p>',

    '<h1>Сейчас в эфире</h1>' +
    '<p>Ты смотришь корневую страницу личного GitHub Pages.</p>' +
    '<p>Здесь ничего не происходит. И это нормально.</p>',

    '<h1>Прогноз погоды</h1>' +
    '<p>Облачно. Местами Google Таблицы.</p>' +
    '<p>Вероятность синхронизации — 100%, если не забыл войти в аккаунт.</p>',

    '<h1>Реклама</h1>' +
    '<p>Здесь могла быть ваша реклама.</p>' +
    '<p>Но её не будет. Никогда.</p>',

    '<h1>Технический перерыв</h1>' +
    '<p class="blink">Смотрю сериал, вернусь после титров </p>'
  ];
  var i = 0;
  var content = document.getElementById('content');
  var ch = document.getElementById('ch');
  var screen = document.getElementById('screen');

  function show(n) {
    i = (n + channels.length) % channels.length;
    content.innerHTML = channels[i];
    ch.textContent = 'CH ' + String(i + 1).padStart(2, '0');
    screen.classList.remove('flash'); void screen.offsetWidth; screen.classList.add('flash');
  }
  document.getElementById('prev').onclick = function () { show(i - 1); };
  document.getElementById('next').onclick = function () { show(i + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') show(i - 1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') show(i + 1);
  });
  show(0);

  // помехи
  var c = document.getElementById('noise'), x = c.getContext('2d');
  var img = x.createImageData(c.width, c.height);
  (function noise() {
    for (var p = 0; p < img.data.length; p += 4) {
      var v = Math.random() * 255 | 0;
      img.data[p] = img.data[p + 1] = img.data[p + 2] = v; img.data[p + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    requestAnimationFrame(noise);
  })();
</script>
</body>
</html>
