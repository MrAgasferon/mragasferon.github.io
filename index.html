<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f4">
<title></title>
<style>
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; }
  body {
    display:grid; place-items:center; overflow:hidden;
    background: radial-gradient(ellipse at 50% 44%, #fff 0 38%, #f5f3ef 100%);
  }
  .scene { width:min(94vw, 760px); height:min(94vh, 1050px); }
  svg { width:100%; height:100%; overflow:visible; }
  .rocker {
    transform-box: view-box;
    transform-origin: 410px 1000px;
    animation: rocking 2.15s ease-in-out infinite;
  }
  .horse {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: horse-bob 2.15s ease-in-out infinite;
  }
  .rider {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: rider-bob 2.15s ease-in-out infinite;
  }
  .tail {
    transform-box: fill-box; transform-origin: 100% 20%;
    animation: tail-swish 2.15s ease-in-out infinite;
  }
  .hat {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: hat-bob 2.15s ease-in-out infinite;
  }
  @keyframes rocking {
    0%,100% { transform:rotate(-3deg) translateY(0); }
    50% { transform:rotate(3deg) translateY(2px); }
  }
  @keyframes horse-bob {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-4px); }
  }
  @keyframes rider-bob {
    0%,100% { transform:translateY(0) rotate(-1deg); }
    50% { transform:translateY(-7px) rotate(1deg); }
  }
  @keyframes tail-swish {
    0%,100% { transform:rotate(-5deg); }
    50% { transform:rotate(8deg); }
  }
  @keyframes hat-bob {
    0%,100% { transform:rotate(0deg); }
    50% { transform:rotate(1.5deg) translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
  }
</style>
</head>
<body>
<main class="scene" aria-label="Ковбой качается на деревянной лошадке">

    <stop offset="0" stop-color="#9b6746"/><stop offset="1" stop-color="#70452e"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
</defs>

</g>
</svg>
</main>
